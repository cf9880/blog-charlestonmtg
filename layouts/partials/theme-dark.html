{{- /* Dark theme for the Charleston blog only. Contrast (WCAG): text #fff on #2a2a2a 14.3:1; gold links #e6b84a 7.7:1; meta #c8c8c8 8.6:1; button #111 on #e6b84a 10.2:1. */ -}}
<style>
body{background:#1e1e1e;color:#fff}
main{background:#2a2a2a;color:#fff}
h1,h2,h3,h4,h5,h6,strong,b{color:#fff}
p,li,td,th,dd,dt,figcaption,label{color:#fff}
a{color:#e6b84a}a:hover,a:focus{color:#ffd700}
.post h2 a{color:#e6b84a}.post h2 a:hover{color:#ffd700}
.meta,.post .meta,small{color:#c8c8c8}
.post{border-bottom:1px solid #444}
